spring:
  application:
    name: stationery-store

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stationery_store}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    jwt:
      # Override with JWT_SECRET in every non-local environment (min. 32 bytes).
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
      expiration: ${JWT_EXPIRATION:8h}
      issuer: stationery-store

  auth:
    bootstrap-admin:
      enabled: true
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Admin123}
      full-name: Administrador
